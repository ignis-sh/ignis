[package]
name = "py-mpris"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "py_mpris"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["experimental-inspect", "multiple-pymethods"] }
mpris = { path = "../mpris" }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
ignis-core = { path = "../ignis-core" }
py-shared-ignis-core = { path = "../py-shared-ignis-core" }
