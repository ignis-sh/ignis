[workspace]
members = ["crates/applications","crates/glib_utils",
    "crates/notifications",
    "crates/notifications_glib",
    "crates/py_applications",
]

resolver = "3"

[workspace.dependencies]
glib = "0.22.7"
gio = "0.22.6"
gdk-pixbuf = "0.22.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "sync", "process", "time"] }
glib_utils = { path = "./crates/glib_utils" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.17"

[workspace.package]
license = "MIT"
