name: Rust Doc

on:
  push:
    branches:
      - main
      - rust-rewrite

  pull_request:

jobs:
  doc:
    name: Build & Deploy Rust doc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgdk-pixbuf-2.0-dev

      - name: Build documentation
        run: |
          cargo doc --all-features --no-deps \
                    -p notifications

          mkdir -p ./public
          cp -r ./target/doc/* ./public

          echo '<meta http-equiv="refresh" content="0; url=notifications/index.html">' > ./public/index.html
          touch ./public/.nojekyll

      - name: Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'ref/heads/rust-rewrite')
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RUST_DOC_DEPLOY_TOKEN }}
          external_repository: ignis-sh/rust-doc
          publish_branch: gh-pages
          publish_dir: ./public

  glib-bindings-doc:
    name: Build & Deploy GLib doc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: System dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y just \
          libgirepository-2.0-dev gcc libcairo2-dev pkg-config python3-dev \
          libglib2.0-dev gobject-introspection meson ninja-build \
          libgdk-pixbuf-2.0-dev \
          gir1.2-glib-2.0 gir1.2-gdkpixbuf-2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gi-docgen

      - name: Debug
        run: |
          ls /usr/share
          ls /usr/share/gir-1.0

          echo $XDG_DATA_DIRS

      - name: Build documentation
        run: |
          mkdir -p ./public

          for crate in notifications_glib; do
              (
                  cd "crates/$crate"
                  just doc
                  mkdir -p "../../public/$crate"
                  cp -r ./_build/* "../../public/$crate/"
              )
          done

          echo '<meta http-equiv="refresh" content="0; url=notifications_glib/index.html">' > ./public/index.html
          touch ./public/.nojekyll

      - name: Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'ref/heads/rust-rewrite')
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GI_DOC_DEPLOY_TOKEN }}
          external_repository: ignis-sh/gi-doc
          publish_branch: gh-pages
          publish_dir: ./public
