name: Rust CI

on:
  push:
    branches:
      - main
      - rust-rewrite
  pull_request:

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - crate: notifications
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev
          - crate: notifications_glib
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev
          - crate: glib_utils
            packages: libglib2.0-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - if: matrix.packages != ''
        name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy check
        run: cargo clippy -p ${{ matrix.crate }} --all-features -- -D warnings

  test:
    name: Test crates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - crate: notifications
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev

          - crate: applications
            packages: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - if: matrix.packages != ''
        name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Run tests
        run: |
          cd crates/${{ matrix.crate }}
          just test

  test-glib-bindings:
    name: Test GLib bindings
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - crate: notifications_glib
            packages: libgdk-pixbuf-2.0-dev libnotify-bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - if: matrix.packages != ''
        name: System dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y just \
          libgirepository-2.0-dev gcc libcairo2-dev pkg-config python3-dev \
          libglib2.0-dev gobject-introspection meson ninja-build \
          ${{ matrix.packages }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGObject pytest

      - name: Run tests
        run: |
          cd crates/${{ matrix.crate }}
          just test
