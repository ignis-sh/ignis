name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - crate: notifications
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev
          - crate: notifications_glib
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev
          - crate: glib_utils
            packages: libglib2.0-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - if: matrix.packages != ''
        name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy check
        run: cargo clippy -p ${{ matrix.crate }} --all-features -- -D warnings

  test:
    name: Test crates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - crate: notifications
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev
          - crate: notifications_glib
            packages: libglib2.0-dev libgdk-pixbuf-2.0-dev meson ninja-build python3 python3-pytest python3-gi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - if: matrix.packages != ''
        name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install just
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Run tests
        run: |
          cd crates/${{ matrix.crate }}
          just test
